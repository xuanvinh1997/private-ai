[package]
name = "pai-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
pai-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }

# The IANA zone table, compiled in: `time.now` must answer for `America/New_York` on a machine
# that has never heard of it, and reading the host's `/usr/share/zoneinfo` is exactly the kind
# of filesystem dependency this crate is supposed to be free of.
chrono-tz = "0.10"
# Reads the machine's own zone *name*, which `chrono::Local` cannot give — it offers an offset,
# and an offset forgets that summer ends. Already in the tree as a `chrono` dependency, so
# naming it here adds a line, not a build.
iana-time-zone = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
