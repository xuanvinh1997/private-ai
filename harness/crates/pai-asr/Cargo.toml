[package]
name = "pai-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nhận dạng tiếng nói: tệp âm thanh vào thư viện tài liệu, và micro vào ô soạn tin"

[dependencies]
symphonia = { workspace = true }
rubato = { workspace = true }
cpal = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# Metal chỉ có trên Apple; nơi khác để backend mặc định của thư viện tự chọn.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.2", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "0.2", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
