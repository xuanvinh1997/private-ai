[package]
name = "pai-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pai-core = { workspace = true }
pai-sandbox = { workspace = true }
pai-tools = { workspace = true }
tokio = { workspace = true, features = ["time", "rt"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }

# Declared locally, not in `[workspace.dependencies]`: this is the only crate that needs a PTY. It is WezTerm's PTY core.
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
# Only for signalling a whole process group, same reason as `pai-shell`.
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
