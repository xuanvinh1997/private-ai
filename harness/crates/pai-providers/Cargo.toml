[package]
name = "pai-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kho provider mô hình, danh mục dựng sẵn, và đường đổi provider lúc đang chạy"

[dependencies]
pai-core = { workspace = true }
pai-llm = { workspace = true }
# `Driver` is the other end of a provider swap: the store means nothing without somewhere to push the new adapter.
pai-agent = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
arc-swap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The migration test must build a file on the old schema, so it needs raw SQL of its own.
rusqlite = { workspace = true }
# `net` + `io-util`: the model-listing test serves fake HTTP from a plain `TcpListener`, so it runs offline.
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "net",
  "io-util",
] }
# The mid-turn swap test runs a real turn, so it needs the whole scaffold: session log, tool pipeline, fake adapter.
pai-core = { workspace = true }
pai-session = { workspace = true }
pai-tools = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
