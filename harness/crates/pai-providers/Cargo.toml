[package]
name = "pai-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kho provider mô hình, danh mục dựng sẵn, và đường đổi provider lúc đang chạy"

[dependencies]
pai-core = { workspace = true }
pai-llm = { workspace = true }
# `Driver` là đầu kia của cú đổi provider: kho không có nghĩa gì nếu không có ai để đẩy
# adapter mới vào.
pai-agent = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
arc-swap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Bài kiểm chứng migrate phải dựng được một tệp theo **lược đồ cũ**, nên nó cần nói SQL
# trực tiếp — bài kiểm chứng là một crate riêng và không thấy `[dependencies]` ở trên.
rusqlite = { workspace = true }
# `net` + `io-util`: bài kiểm chứng kho mô hình dựng một máy chủ HTTP giả bằng
# `TcpListener` thuần, để nó chạy được cả khi rút dây mạng.
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "net",
  "io-util",
] }
# Bài kiểm chứng "đổi mô hình giữa lượt" phải chạy một lượt thật, nên nó cần đủ giàn của
# một lượt: sổ phiên, đường ống tool, và một adapter giả biết dừng lại giữa chừng.
pai-core = { workspace = true }
pai-session = { workspace = true }
pai-tools = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
