[package]
name = "pai-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pai-core = { workspace = true }
pai-tools = { workspace = true }
pai-fs = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# Deliberately no `lsp-types`: we use seven methods, and its types change per spec release
# and reject unknown fields, so a slightly off-spec server fails at parse time. Plain
# `serde_json::Value` just ignores what we do not read, which is the safe direction here.

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
