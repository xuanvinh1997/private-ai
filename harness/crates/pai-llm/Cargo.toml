[package]
name = "pai-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pai-core = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
# rustls is already on at the workspace level: a packaged build must run on a bare machine.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `net` is only for the tests: a fake HTTP server on a plain TcpListener, so they run offline.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "io-util"] }
futures = { workspace = true }
