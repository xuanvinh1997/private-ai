[package]
name = "pai-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pai-core = { workspace = true }
pai-tools = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }

# Kept out of `[workspace.dependencies]` on purpose: only this crate speaks server-side HTTP, and `reqwest` already pulls them in.
http = "1"
http-body-util = "0.1"
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
# Secrets must come from the OS CSPRNG; the workspace's uuid v7 is a timestamp plus a little randomness.
rand = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }
tempfile = { workspace = true }
