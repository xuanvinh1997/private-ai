[package]
name = "pai-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pai-core = { workspace = true }
pai-tools = { workspace = true }
pai-fs = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
ignore = { workspace = true }

# --- tree-sitter ---
# Local, not workspace-wide: only this crate uses it; 0.25 is pinned because core/grammar ABI drift only fails at runtime.
tree-sitter = "0.25"
# Only to name `LanguageFn` in the language table; core does not re-export it.
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
# `QueryCursor::matches` returns a streaming iterator since 0.25; the trait must be in scope.
streaming-iterator = "0.1"

[dev-dependencies]
pai-core = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
