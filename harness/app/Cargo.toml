[package]
name = "pai-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Private AI — coding & working agent desktop"

[lib]
name = "pai_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Hộp thoại chọn thư mục của hệ điều hành. Chỉ `open`: ứng dụng không bao giờ ghi tệp
# qua hộp thoại — mọi đường ghi đều đi qua tool đã bị `pai-fs` chặn theo gốc dự án.
tauri-plugin-dialog = "2"
pai-core = { workspace = true }
pai-tools = { workspace = true }
pai-session = { workspace = true }
pai-agent = { workspace = true }
pai-llm = { workspace = true }
pai-hooks = { workspace = true }
pai-index = { workspace = true }
pai-lsp = { workspace = true }
pai-mcp = { workspace = true }
pai-project = { workspace = true }
pai-sandbox = { workspace = true }
pai-shell = { workspace = true }
pai-terminal = { workspace = true }
pai-fs = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
indexmap = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
arc-swap = { workspace = true }
pai-providers = { workspace = true }
pai-rag = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
pai-agent = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { workspace = true }
pai-tools = { workspace = true }
pai-hooks = { workspace = true }
pai-index = { workspace = true }
pai-lsp = { workspace = true }
pai-mcp = { workspace = true }
pai-project = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
pai-session = { workspace = true }
