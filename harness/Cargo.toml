[workspace]
resolver = "3"
members = ["crates/*", "app"]
# The vendored patch is not one of our crates: it skips `[workspace.package]` and must stay out of `cargo test --workspace`.


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
# --- async core ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# --- data ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rusqlite = { version = "0.37", features = ["bundled", "serde_json", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }

# --- infrastructure ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
arc-swap = "1"
parking_lot = "0.12"

# --- network ---
# rustls instead of system OpenSSL: the bundle must run on a bare machine, and a C dep is one more thing to sign at release.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }

# --- MCP ---
# Official MCP Rust SDK; both roles from one crate so client and server share a single protocol implementation.
rmcp = { version = "3.2", default-features = false, features = ["client", "server", "reqwest", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }

# --- file search: ripgrep's own guts as a library, so no external binary to ship and maintain ---
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
globset = "0.4"

# --- misc ---
indexmap = "2"
# Only for signalling a whole process group: killing a shell does not kill its descendants.
libc = "0.2"
similar = "2"
serde_norway = "0.9"
# --- document layer ---
# Text extraction from PDF and DOCX; pure Rust so the bundle needs no `pdftotext` or LibreOffice installed.
pdf-extract = "0.9"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
encoding_rs = "0.8"
tempfile = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdfium-bundled = "0.1.1"
# Local cross-encoder inference. ONNX Runtime is fetched at build time; model weights are
# pinned and bundled separately by scripts/prepare-reranker.mjs.
fastembed = { version = "6.0.2", default-features = false, features = ["ort-download-binaries-rustls-tls"] }

# --- audio / ASR ---
# Giải mã âm thanh thuần Rust (wav, mp3, m4a/aac, flac, ogg) và lấy mẫu lại về 16 kHz;
# `transcribe.cpp` chỉ nhận PCM f32 mono 16 kHz và cố ý không liên kết bộ resample nào.
symphonia = { version = "0.5", default-features = false, features = ["wav", "aiff", "caf", "pcm", "adpcm", "mp3", "aac", "isomp4", "alac", "flac", "ogg", "vorbis", "mkv"] }
rubato = "0.16"
# Micro cho đọc chính tả. PCM không đi qua cầu IPC: lõi lấy mẫu rồi trả về chữ.
cpal = "0.16"

# --- internal crates ---
pai-core = { path = "crates/pai-core" }
pai-session = { path = "crates/pai-session" }
pai-llm = { path = "crates/pai-llm" }
pai-tools = { path = "crates/pai-tools" }
pai-fs = { path = "crates/pai-fs" }
pai-shell = { path = "crates/pai-shell" }
pai-terminal = { path = "crates/pai-terminal" }
pai-sandbox = { path = "crates/pai-sandbox" }
pai-mcp = { path = "crates/pai-mcp" }
pai-project = { path = "crates/pai-project" }
pai-agent = { path = "crates/pai-agent" }
pai-hooks = { path = "crates/pai-hooks" }
pai-index = { path = "crates/pai-index" }
pai-lsp = { path = "crates/pai-lsp" }
pai-rag = { path = "crates/pai-rag" }
pai-rag-core = { path = "crates/pai-rag-core" }
pai-providers = { path = "crates/pai-providers" }
pai-asr = { path = "crates/pai-asr" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
