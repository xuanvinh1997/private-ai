# Private AI background stack: Ollama serves models, Qdrant holds vectors. The entity graph has
# no container - it is embedded SurrealDB inside pai-rag-service, a directory per project.
# `pai-rag-service` is deliberately not here - it runs on the host, started by the app over
# MCP stdio, so it reads the user's document folder by real Windows paths with no bind mount.

name: private-ai

# Qdrant lives in services/rag/deploy/ next to its README and config; `include` keeps one `up -d` while its tuning stays beside the docs explaining it.
include:
  - path: services/rag/deploy/docker-compose.yml
    env_file: services/rag/deploy/.env

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - "D:/ollama:/root/.ollama"
      # - "D:/Development/lmstudio/models/lmstudio-community:/models:ro"
    environment:
      - "OLLAMA_HOST=0.0.0.0:11434"
      - "OLLAMA_KEEP_ALIVE=60m"
      # RTX PRO 6000 Blackwell has 96 GB VRAM -> keep 2 models resident
      - "OLLAMA_MAX_LOADED_MODELS=2"
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
