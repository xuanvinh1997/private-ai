# Private AI background stack. The Rust application reads documents in-process;
# Ollama serves models and Qdrant holds vectors.

name: private-ai

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - "D:/ollama:/root/.ollama"
      # - "D:/Development/lmstudio/models/lmstudio-community:/models:ro"
    environment:
      - "OLLAMA_HOST=0.0.0.0:11434"
      - "OLLAMA_KEEP_ALIVE=60m"
      # RTX PRO 6000 Blackwell has 96 GB VRAM -> keep 2 models resident
      - "OLLAMA_MAX_LOADED_MODELS=2"
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: pai-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?chưa đặt QDRANT_API_KEY trong .env — xem .env.example}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - pai-qdrant-storage:/qdrant/storage
      - pai-qdrant-snapshots:/qdrant/snapshots
      - ./qdrant/local.yaml:/qdrant/config/local.yaml:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: ${QDRANT_MEM_LIMIT:-16g}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pai-qdrant-storage:
    name: pai-qdrant-storage
  pai-qdrant-snapshots:
    name: pai-qdrant-snapshots
