[project]
name = "private-ai-desktop"
version = "0.1.0"
description = "Native desktop launcher for Private AI"
requires-python = ">=3.12"
dependencies = ["pywebview>=5.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
private-ai-desktop = "private_ai_desktop.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_ai_desktop"]

