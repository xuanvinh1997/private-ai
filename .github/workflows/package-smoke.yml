name: Package smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: private-ai-macos-universal
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact: private-ai-windows-x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Install UI dependencies
        run: npm ci --prefix harness/ui
      - name: Build unsigned production package
        working-directory: harness
        run: node scripts/package.mjs --target ${{ matrix.target }} --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: harness/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          compression-level: 0
