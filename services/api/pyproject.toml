[project]
name = "private-ai-api"
version = "0.1.0"
description = "Cross-platform API gateway for the Private AI desktop application"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "markitdown[docx,pdf,pptx,xlsx]>=0.1.7,<0.2",
  "markitdown-ocr>=0.1,<0.2",
  "mcp>=2,<3",
  "neo4j-graphrag>=1.19,<2",
  "orjson>=3.10,<4",
  "openai>=2,<4",
  "pydantic-settings>=2.6,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.12,<1",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
private-ai-api = "private_ai_api.main:run"
private-ai-mcp = "private_ai_api.mcp_server:run"
private-ai-neo4j = "private_ai_api.neo4j_manager:run"
private-ai-asr = "private_ai_api.asr_manager:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/private_ai_api"]
