# The RAG layer's one data store: Qdrant, holding chunk vectors. The entity graph left this file
# when it moved to embedded SurrealDB - the service opens a directory itself, so there is no
# container, no JVM and no password to keep in sync.
# One user, one machine, one client, so every setting favours single-query latency and
# durability over throughput: one node each. Setup: cp .env.example .env, then up -d.

# No `name:` here: this file is `include:`d from the repo-root compose file, which owns the project name.

services:
  # Qdrant - vector store for the dense embedding of each chunk.
  qdrant:
    # Pin one version: Qdrant can upgrade storage but not downgrade, so version drift is one-way.
    image: qdrant/qdrant:v1.19.0
    container_name: pai-qdrant
    restart: unless-stopped

    # Loopback only, deliberately not from an env var: Qdrant has one flat api-key and no per-collection permissions. Use an SSH tunnel for remote access.
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"

    environment:
      # Secrets via env, the rest in qdrant/local.yaml; `:?` stops compose loudly instead of running wide open on an empty variable.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?chưa đặt QDRANT_API_KEY trong .env — xem .env.example}
      # This app is fully local; it has no reason to call out.
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: INFO

    volumes:
      - pai-qdrant-storage:/qdrant/storage
      # Snapshots on their own volume: a backup sharing a volume with the data it restores is no backup.
      - pai-qdrant-snapshots:/qdrant/snapshots
      - ./qdrant/local.yaml:/qdrant/config/local.yaml:ro

    # Qdrant mmaps segments and opens several files per segment; the old 1024 nofile default breaks as collections grow.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    # RAM ceiling: ~2.5 GB int8 plus ~10 GB originals for rescoring, and a cap keeps a bad ingest from swapping out Ollama.
    mem_limit: ${QDRANT_MEM_LIMIT:-16g}

    healthcheck:
      # The image has no curl/wget but does have bash, so speak HTTP over /dev/tcp; `/readyz` is api-key exempt and only returns 200 once collections are loaded.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      # Startup is fast on a small store, but the first run after a million vectors has to mmap every segment.
      start_period: 30s
      retries: 5

    stop_grace_period: 30s

    # No external log rotation on a personal machine, so cap it here or the json log fills the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pai-qdrant-storage:
    name: pai-qdrant-storage
  pai-qdrant-snapshots:
    name: pai-qdrant-snapshots
