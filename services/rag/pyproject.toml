[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pai-rag-service"
version = "0.1.0"
description = "Tầng RAG của Private AI: nạp đa định dạng, OCR bằng VLM, truy hồi nhiều chiến lược, nói MCP"
# Ghim 3.12: onnxruntime và markitdown chưa có wheel cho 3.13+, và PyInstaller cần đúng
# một phiên bản để dựng bản đóng gói. Không phải một trần tuỳ tiện.
requires-python = ">=3.12,<3.13"

dependencies = [
    # Nói MCP. Đây là toàn bộ giao diện ra ngoài của tiến trình này.
    "mcp>=1.2",
    # LangChain: chỉ phần lõi và phần cắt đoạn. Không kéo cả `langchain` vào — bản đóng
    # gói phải nhỏ, và thứ cần ở đây là `Document`, `Embeddings` và `TextSplitter`.
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    # Rút chữ đa định dạng. `[all]` mang theo docx, xlsx, pptx, pdf, outlook, audio.
    "markitdown[all]>=0.1.2",
    "pypdf>=5.1",
    # Dựng ảnh trang PDF để đưa cho VLM đọc, khi lớp chữ không đáng tin.
    "pypdfium2>=4.30",
    "httpx>=0.27",
    "numpy>=2.1",
    # Reranker chạy ONNX, không torch. `tokenizers` là bản Rust, đi kèm rất nhẹ.
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "huggingface-hub>=0.26",
    # Vector store. Qdrant chạy ngoài tiến trình — xem `deploy/`.
    "qdrant-client>=1.12",
    # Graph.
    "neo4j>=5.26",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Reranker trên GPU. Đo trên RTX PRO 6000, 30 đoạn mỗi câu hỏi:
#
#   CPU  11,06 s        <- không dùng được cho tìm kiếm tương tác
#   GPU   1,03 s        <- nhanh gấp ~10,7 lần
#
# ĐỜI CUDA. `onnxruntime-gpu` ghim cứng một đời CUDA, và sai đời thì nó **lùi về CPU
# trong im lặng** (xem `OnnxReranker._canh_bao_neu_tut_ve_cpu`).
#
# Ghim 1.22 = CUDA 12, **không** phải bản mới nhất, và đây là một lựa chọn có đo:
# onnxruntime-gpu 1.29 đòi CUDA 13, nhưng cho CUDA 13 thì PyPI mới chỉ có wheel thật của
# `nvidia-cudnn-cu13` — `nvidia-cublas-cu13` và phần còn lại vẫn là gói rỗng 0.0.1. Không
# có `cublasLt64_13.dll` thì provider CUDA không nạp được, và cách duy nhất lấp chỗ ấy là
# cài cả CUDA Toolkit lên máy. Bộ `-cu12` thì đầy đủ trên PyPI, và driver mới vẫn chạy
# CUDA 12 (driver tương thích ngược).
#
# Thư viện CUDA của gói pip không nằm trên PATH hệ thống, nên phải gọi
# `onnxruntime.preload_dlls()` trước khi dựng phiên — đã làm trong `OnnxReranker._ensure`.
#
# Cần: driver >= 525 (bản đo: 597.06). Không có đường nào lấy driver qua pip.
gpu = [
    "onnxruntime-gpu==1.22.0",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "python-docx>=1.1"]
package = ["pyinstaller>=6.11"]

[project.scripts]
pai-rag = "pai_rag_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pai_rag_service"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
