[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pai-rag-service"
version = "0.1.0"
description = "Tầng RAG của Private AI: nạp đa định dạng, OCR bằng VLM, truy hồi nhiều chiến lược, nói MCP"
# Pinned to 3.12: onnxruntime and markitdown have no 3.13+ wheels, and PyInstaller needs one exact version.
requires-python = ">=3.12,<3.13"

dependencies = [
    # Speaks MCP. This is the entire external interface of the process.
    "mcp>=1.2",
    # LangChain core and splitters only: the bundle must stay small, and we need `Document`, `Embeddings` and `TextSplitter`.
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    # Multi-format text extraction. `[all]` brings docx, xlsx, pptx, pdf, outlook, audio.
    "markitdown[all]>=0.1.2",
    "pypdf>=5.1",
    # Renders PDF page images for the VLM to read when the text layer is untrustworthy.
    "pypdfium2>=4.30",
    "httpx>=0.27",
    "numpy>=2.1",
    # Reranker on ONNX, not torch. `tokenizers` is the Rust build and is very light.
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "huggingface-hub>=0.26",
    # Vector store. Qdrant runs out of process - see `deploy/`.
    "qdrant-client>=1.12",
    # Graph. SurrealDB runs embedded in this process (`surrealkv://`): no server, no JVM, so a bundle only has to copy files.
    "surrealdb>=2.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# GPU reranker (~10x faster). Pinned to 1.22 = CUDA 12: a mismatched generation silently falls back to CPU, and PyPI's CUDA 13 packages are still stubs.
gpu = [
    "onnxruntime-gpu==1.22.0",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "python-docx>=1.1"]
package = ["pyinstaller>=6.11"]

[project.scripts]
pai-rag = "pai_rag_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pai_rag_service"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
